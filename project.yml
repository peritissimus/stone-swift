name: Stone
options:
  bundleIdPrefix: com.stone
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES
      DEAD_CODE_STRIPPING: YES

packages:
  StoneKit:
    path: Packages/StoneKit

targets:
  Stone:
    type: application
    platform: macOS
    sources:
      - path: Stone
        excludes:
          - "**/Info.plist"
    dependencies:
      - package: StoneKit
        product: StoneDomain
      - package: StoneKit
        product: StoneApplication
      - package: StoneKit
        product: StoneAdaptersOut
      - package: StoneKit
        product: StoneUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stone.app
        INFOPLIST_FILE: Stone/Infrastructure/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # A local build gets its own prefs and hotkey registration instead of sharing the installed app's.
        Debug:
          PRODUCT_NAME: Stone Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.stone.app.dev
